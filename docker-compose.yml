# Local: `docker compose up --build`, then open http://admin.localhost:3000
# Coolify: deploy as a Docker Compose resource; see README "Deploying on Coolify".

x-app-env: &app-env
  NODE_ENV: production
  APP_BASE_DOMAIN: ${APP_BASE_DOMAIN}
  APP_PROTOCOL: ${APP_PROTOCOL:-https}
  APP_PUBLIC_PORT: ${APP_PUBLIC_PORT:-}
  DATABASE_URL: postgres://awdrent_app:${DB_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-awdrent}
  DATABASE_AUTH_URL: postgres://awdrent_auth:${DB_AUTH_PASSWORD}@postgres:5432/${POSTGRES_DB:-awdrent}
  DATABASE_PLATFORM_URL: postgres://awdrent_platform:${DB_PLATFORM_PASSWORD}@postgres:5432/${POSTGRES_DB:-awdrent}
  REDIS_URL: redis://redis:6379
  RATE_LIMIT_STORAGE: redis
  AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
  S3_ENDPOINT: http://seaweedfs:8333
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
  S3_REGION: ${S3_REGION:-af-south-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_BUCKET: ${S3_BUCKET:-awdrent}
  S3_FORCE_PATH_STYLE: "true"
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  ENCRYPTION_KEYS: ${ENCRYPTION_KEYS}
  ENCRYPTION_ACTIVE_KEY_VERSION: ${ENCRYPTION_ACTIVE_KEY_VERSION}
  BLIND_INDEX_KEY: ${BLIND_INDEX_KEY}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  PLATFORM_AUTH_SECRET: ${PLATFORM_AUTH_SECRET}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-AWDRent <no-reply@awdrent.co.za>}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-awdrent}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD}
      DB_PLATFORM_PASSWORD: ${DB_PLATFORM_PASSWORD}
      TEST_DATABASE_NAME: ${TEST_DATABASE_NAME:-awdrent_test}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible document store (decision D25). Private: only the app's
  # signed links reach files. Contents are encrypted at rest.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/awdrent/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - seaweeddata:/data
      - ./docker/seaweedfs:/etc/awdrent:ro
    ports:
      - "${S3_HOST_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamdata:/var/lib/clamav
    ports:
      - "${CLAMAV_HOST_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  # Creates the storage bucket, runs migrations (and the demo seed when
  # SEED_DEMO=true), then exits.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command:
      - /bin/sh
      - -c
      - >-
        node --import tsx packages/core/scripts/ensure-bucket.ts &&
        node --import tsx packages/db/src/migrate.ts &&
        if [ "$$SEED_DEMO" = "true" ]; then node --import tsx packages/core/scripts/seed.ts; fi
    environment:
      <<: *app-env
      DATABASE_OWNER_URL: postgres://awdrent_owner:${DB_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-awdrent}
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  seaweeddata:
  clamdata:
